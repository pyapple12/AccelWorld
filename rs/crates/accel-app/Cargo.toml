# egui 前端 crate（Python ui/ 层的 Rust 等价物）
# PL011 为占位空壳：eframe/egui 等依赖 PL013 引入（z.plan 修订二·B）
[package]
name = "accel-app"
version = "0.6.0"
edition = "2024"
description = "AccelWorld egui 前端：窗口/玻璃渲染/五页导航 + 设置浮窗/系统集成"
# 双 bin（accel-app + render_probe）下 `cargo run -p accel-app` 需 default-run 消歧
# （FIX006 执行补录：AGENTS.md 记载的 GUI 冒烟命令原因此歧义直接失败）
default-run = "accel-app"

[dependencies]
accel-core = { path = "../accel-core" }
serde_json = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
wgpu = { workspace = true }
egui-wgpu = { workspace = true }
chrono-tz = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
tray-icon = { workspace = true }
global-hotkey = { workspace = true }
tauri-winrt-notification = { workspace = true }

[[bin]]
name = "render_probe"
path = "src/bin/render_probe.rs"

# 构建期依赖（build.rs 专用，不进运行时依赖树）
[build-dependencies]
serde_json = { workspace = true }

# ===== crates/accel-app/Cargo.toml 说明区 =====
# version = "0.6.0"：对齐产品版本段 0.6.0.0（semver 三段上限）
# PL011 占位：仅依赖 core（验证依赖方向单向），显示版本经 build.rs 从
#   rs/config/static/base.json 注入（PL013 落位）
# PL013 起接入：eframe(wgpu)/egui/pollster/image/windows/
#   tray-icon/global-hotkey/rodio/chrono-tz——全部走 workspace.dependencies
