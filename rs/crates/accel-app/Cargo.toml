# egui 前端 crate（Python ui/ 层的 Rust 等价物；UIR 后渲染器 eframe glow 实心装配）
[package]
name = "accel-app"
version = "0.6.0"
edition = "2024"
description = "AccelWorld egui 前端：窗口/实心桌面 UI 五页导航 + 设置浮窗/系统集成"
# 单 bin（render_probe 已随 UIR 玻璃拆除删除）；default-run 保留为无害冗余
# （FIX006 时期双 bin 消歧的历史产物）
default-run = "accel-app"

[dependencies]
accel-core = { path = "../accel-core" }
serde_json = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono-tz = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
tray-icon = { workspace = true }
global-hotkey = { workspace = true }
tauri-winrt-notification = { workspace = true }

# 构建期依赖（build.rs 专用，不进运行时依赖树）
[build-dependencies]
serde_json = { workspace = true }

# ===== crates/accel-app/Cargo.toml 说明区 =====
# version = "0.6.0"：对齐产品版本段 0.6.1（semver 三段上限）；显示版本经 build.rs
#   从 rs/config/static/base.json 注入（版本单一来源，本文件不随四段位 bump）
# 依赖（全部走 workspace.dependencies）：accel-core（单向分层，CI 关卡 4 强制）+
#   eframe(glow)/egui/pollster/image/chrono/tokio/tracing 三件/chrono-tz/
#   raw-window-handle + Windows 档 windows/tray-icon/global-hotkey/
#   tauri-winrt-notification；serde_json 为 build.rs 版本注入专用
#   （FIX007.11 订正：原「PL011 占位」表述过时，rodio 属 accel-core 不在本 crate；
#   A008 #6 订正：wgpu/egui-wgpu 已随 UIR 拆除，渲染器为 eframe glow）
