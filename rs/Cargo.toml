# AccelWorld RS 工作区根清单（PL011.02 落位）
# 结构镜像自 Python 工程（z.plan 镜像映射表）：core = 纯业务后端，app = egui 前端
[workspace]
resolver = "3"
members = ["crates/*"]

# 统一依赖版本（2026-10-16 crates.io 核验最新稳定，PL011 只装 core 所需 + app 占位）
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip：正确舍入浮点解析（默认实现可差 1 ULP——夹具 parity 位级断言的硬前提，
# PL011.10 实证：110.00000000000001 默认解析为 110.0）
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
# reqwest 0.13 特性更名：rustls-tls → rustls（关 default-features + rustls：纯 Rust TLS 栈，不链系统 OpenSSL）
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
chrono = { version = "0.4.45", features = ["clock"] }
chrono-tz = "0.10.4"
lunar_rust = "1.0.1"
rodio = "0.23.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
httpmock = "0.8.3"
# PL013 GUI 栈（app 侧；wayland/x11 为 eframe default-features 组件，Linux CI 兼容）
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37.0"
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Gdi/Xps/WindowsAndMessaging：UI 截图探针（UIR.2 PrintWindow 在 Storage::Xps +
#   GetClientRect/GetDIBits）——开发期视觉自检
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6.2"
# PL015 系统集成三件：托盘菜单（含 muda）/全局热键/WinRT 通知
tray-icon = "0.25.1"
global-hotkey = "0.8.0"
tauri-winrt-notification = "0.7.3"

# ===== rs/Cargo.toml 说明区 =====
# [workspace]：members 通配 crates/*，后续新增 crate 无须改本文件
# 依赖引入节奏（z.plan 修订二·B）：tray-icon/global-hotkey 系 PL015 引入
# reqwest 关 default-features + rustls：不链接系统 OpenSSL，纯 Rust TLS 栈
# httpmock 为 dev 依赖（core 单测桩服务），不进正式依赖树
